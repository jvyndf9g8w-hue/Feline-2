const court=document.getElementById('court'),ball=document.getElementById('ball');let mode='move',tokens=[],selected=null,drag=null,history=[],future=[],ballPos={x:53.3,y:60.2};
const seed=[['r',17,22,0],['r',50,22,0],['r',83,22,0],['r',13,55,0],['r',87,55,0],['g',27,40,0],['g',34,48,0],['g',42,53,0],['r',50,53,0],['g',58,53,0],['g',66,48,0],['g',73,40,0],['r',50,75,0]];
function snapshot(){return JSON.stringify({tokens:tokens.map(({id,team,x,y,angle})=>({id,team,x,y,angle})),ballPos});}function checkpoint(){history.push(snapshot());if(history.length>60)history.shift();future=[];}
function restore(s){let d=JSON.parse(s);tokens.forEach(t=>t.el.remove());tokens=[];d.tokens.forEach(t=>addToken(t.team,t.x,t.y,t.angle,t.id,false));ballPos=d.ballPos;paint();selected=null;}
function paint(){tokens.forEach(t=>{t.el.style.left=t.x+'%';t.el.style.top=t.y+'%';t.img.style.transform=`rotate(${t.angle}deg)`;t.el.classList.toggle('selected',t===selected)});ball.style.left=ballPos.x+'%';ball.style.top=ballPos.y+'%';}
function addToken(team,x=50,y=50,angle=0,id=crypto.randomUUID?.()||String(Date.now()+Math.random()),record=true){if(record)checkpoint();let el=document.createElement('div');el.className='token';el.innerHTML='<img draggable="false" alt="Pion"><div class="rotate-handle" aria-label="Tourner le pion"></div>';let img=el.querySelector('img'),handle=el.querySelector('.rotate-handle');img.src=team==='g'?GREEN:RED;court.append(el);let t={id,team,x,y,angle,el,img,handle};tokens.push(t);el.addEventListener('pointerdown',e=>{if(mode==='erase'){e.preventDefault();checkpoint();tokens=tokens.filter(q=>q!==t);el.remove();selected=null;return}if(e.target===handle)return;e.preventDefault();e.stopPropagation();selected=t;if(mode==='rotate'){drag={kind:'rotate',t};}else{checkpoint();drag={kind:'move',t,dx:0,dy:0};}el.setPointerCapture(e.pointerId);paint();});handle.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();selected=t;checkpoint();drag={kind:'rotate',t};el.setPointerCapture(e.pointerId);paint()});paint();return t;}
function coords(e){let r=court.getBoundingClientRect();return{x:Math.max(1,Math.min(99,(e.clientX-r.left)/r.width*100)),y:Math.max(2,Math.min(98,(e.clientY-r.top)/r.height*100))}}
ball.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(mode==='erase'){checkpoint();ballPos={x:50,y:50};paint();return}checkpoint();selected=null;drag={kind:'ball'};ball.setPointerCapture(e.pointerId);paint()});
court.addEventListener('pointermove',e=>{if(!drag)return;let p=coords(e);if(drag.kind==='move'){drag.t.x=p.x;drag.t.y=p.y}else if(drag.kind==='ball'){ballPos=p}else if(drag.kind==='rotate'){let r=court.getBoundingClientRect(),cx=r.left+drag.t.x/100*r.width,cy=r.top+drag.t.y/100*r.height;drag.t.angle=Math.atan2(e.clientY-cy,e.clientX-cx)*180/Math.PI+90}paint()});
court.addEventListener('pointerup',()=>drag=null);court.addEventListener('pointercancel',()=>drag=null);court.addEventListener('pointerdown',e=>{if(e.target===court||e.target.classList.contains('pitch')){if(mode==='draw'){let p=coords(e);checkpoint();drawPoint(p.x,p.y)}else{selected=null;paint()}}});
let strokes=[];function drawPoint(x,y){let dot=document.createElement('div');dot.style.cssText=`position:absolute;left:${x}%;top:${y}%;width:5px;height:5px;background:#fff;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:2`;court.append(dot);strokes.push(dot)}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(q=>q.classList.toggle('active',q===b));});
document.getElementById('addGreen').onclick=()=>addToken('g',50,50);document.getElementById('addRed').onclick=()=>addToken('r',50,50);document.getElementById('addBall').onclick=()=>{checkpoint();ballPos={x:50,y:50};paint()};
document.getElementById('clear').onclick=()=>{checkpoint();tokens.forEach(t=>t.el.remove());tokens=[];strokes.forEach(s=>s.remove());strokes=[];selected=null;ballPos={x:50,y:50};paint()};
document.getElementById('reset').onclick=()=>{checkpoint();tokens.forEach(t=>t.el.remove());tokens=[];strokes.forEach(s=>s.remove());strokes=[];seed.forEach(s=>addToken(s[0],s[1],s[2],s[3],undefined,false));ballPos={x:53.3,y:75};selected=null;paint()};
document.getElementById('save').onclick=()=>{localStorage.setItem('feline31-terrain2',snapshot());alert('Composition enregistrée sur cet appareil.')};document.getElementById('load').onclick=()=>{let s=localStorage.getItem('feline31-terrain2');if(s){checkpoint();restore(s)}else alert('Aucune composition enregistrée sur cet appareil.')};
document.getElementById('undo').onclick=()=>{if(history.length){future.push(snapshot());restore(history.pop())}};document.getElementById('redo').onclick=()=>{if(future.length){history.push(snapshot());restore(future.pop())}};document.getElementById('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
seed.forEach(s=>addToken(s[0],s[1],s[2],s[3],undefined,false));paint();
})();
